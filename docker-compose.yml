services:
  proxy:
    image: nginx:alpine
    container_name: local-rag-proxy
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - host_access
      - no_internet
    depends_on:
      - app
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: local-rag-ollama
    volumes:
      - ~/.ollama:/root/.ollama
    networks:
      - no_internet
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-rag-app
    volumes:
      - .:/app
      - /app/.venv
      - lancedb_data:/app/lancedb_data
      - ./pdf_inbox:/app/pdf_inbox
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_TRANSPORT=http
    networks:
      - no_internet
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  lancedb_data:

networks:
  no_internet:
    internal: true
  host_access:
    driver: bridge